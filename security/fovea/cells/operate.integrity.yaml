id: operate.integrity
status: assessed
owner: roeland@macula.io
threat:
  definition: >-
    The channel/clip state machine is altered mid-flight: an event is
    reordered, dropped, or fabricated, and the catalog announces a state
    the owner never commanded.
  manifestations:
    - A forged retract or publish event entering the stream.
    - A lost event leaving the read model permanently diverged from the store.
defense:
  detection:
    - measure: "The lifecycle is event-sourced: the store is the truth and the read model is rebuilt from it, so divergence is a rebuild away from being corrected."
      status: by_design
      source: README.md ("project_tube ... rebuilt from the store at boot")
  countermeasures:
    - measure: "Facts are pinned by tests (mcl_tube_service_tests, tube_catalog_topic_tests); a change is a new name, not an edit."
      status: by_design
      source: README.md ("Both lists are pinned by tests")
  recovery:
    - measure: "Rebuild the read model from the store; announcements upsert by id, safe to receive twice."
      status: by_design
      source: README.md ("upserts by id, safe to receive twice")
notes: >-
  Assessed: the event-sourced architecture plus pinned fact names is the
  integrity mechanism, cited from this repo's own README.
