id: create.accountability
status: assessed
owner: roeland@macula.io
threat:
  definition: >-
    A change to the source is unattributable afterwards: nobody can say
    who introduced a line, when, or why it was accepted.
  manifestations:
    - Rewritten history hiding who changed a fact or gate.
    - A change with no changelog entry.
defense:
  detection:
    - measure: "Git history plus the Keep-a-Changelog discipline name every behavioural change."
      status: by_design
      source: CHANGELOG.md
  countermeasures:
    - measure: "Protected branches and required reviews are the org's obligation."
      status: org
  recovery:
    - measure: "Revert is a named commit."
      status: by_design
      source: repository itself
