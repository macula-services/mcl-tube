id: deliver.authenticity
status: assumed
owner: roeland@macula.io
threat:
  definition: >-
    The artifact that runs is not the artifact this repository built: a
    substituted image, or a deploy that cannot be traced to the commit it
    came from.
  manifestations:
    - A host running an image whose provenance the operator cannot name.
    - A registry substitution accepted because nothing checks the pull.
defense:
  detection:
    - measure: "The image carries its own revision label — the running artifact names the repository state it came from."
      status: by_design
      source: 'git log: build: the image carries its own revision label'
  countermeasures:
    - measure: "Image channel discipline (pinned tags, no floating latest) is the deploy pattern of the sibling services."
      status: org
      source: deploy/docker-compose.yml
    - measure: "Host-side verification of pulls is the operator's discipline."
      status: org
  recovery:
    - measure: "Re-pin the known-good image tag and redeploy."
      status: by_design
      source: 'git log: build: the image carries its own revision label'
notes: "Assumed: the revision label exists; registry trust and pull verification are unproven pre-deployment."
