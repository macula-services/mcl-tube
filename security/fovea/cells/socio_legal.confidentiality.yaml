id: socio_legal.confidentiality
status: assumed
owner: roeland@macula.io
threat:
  definition: >-
    A legal or political actor compels disclosure of stored material: a
    court order for clip content, channel metadata, or access to the node.
  manifestations:
    - A compelled disclosure of a channel's stored clips.
    - A compelled handover of the host and its volumes.
defense:
  detection:
    - measure: "Compelled disclosure is an org-level event; nothing service-local detects it."
      status: org
  countermeasures:
    - measure: "Legal review and refusal rights are the org's domain."
      status: org
    - measure: "Published content is public by design, so compulsion reveals little beyond what is already served."
      status: by_design
      source: README.md ("anyone on the mesh ... streams a published clip")
  recovery:
    - measure: "Retract removes content from the catalog."
      status: by_design
      source: README.md (video_clip_retracted_v1)
