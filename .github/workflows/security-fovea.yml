name: security-fovea

on:
  workflow_dispatch:
  push:
    paths:
      - "security/fovea/**"
      - ".github/workflows/security-fovea.yml"
  pull_request:
    paths:
      - "security/fovea/**"
      - ".github/workflows/security-fovea.yml"

jobs:
  fovea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hard gate: the grid is complete and lint is clean. A red run blocks.
      - name: "fovea lint"
        uses: macula-io/macula-fovea@main
        with:
          dir: security/fovea
          command: lint

      - name: "fovea score"
        if: always()
        uses: macula-io/macula-fovea@main
        with:
          dir: security/fovea
          command: score

      - name: "Upload fovea artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fovea-artifacts
          path: fovea-artifacts/
          retention-days: 30
