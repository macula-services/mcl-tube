<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" role="img" aria-label="mcl-tube system context">
<title>mcl-tube system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1160" height="780"/>
<rect class="b-per" x="40" y="30" width="300" height="120" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Owner</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">Creates a channel, uploads clips</text>
<text class="t-desc" x="56" y="116">and publishes, retracts and archives</text>
<text class="t-desc" x="56" y="132">them through the web UI</text>
<rect class="b-per" x="420" y="30" width="300" height="120" rx="10"/>
<circle class="head" cx="446" cy="54" r="9"/>
<text class="t-name" x="464" y="58">Viewer</text>
<text class="t-type" x="464" y="76">[Person]</text>
<text class="t-desc" x="436" y="100">Any mesh caller: an app that looks</text>
<text class="t-desc" x="436" y="116">a channel, a clip or its content up,</text>
<text class="t-desc" x="436" y="132">and streams a published clip</text>
<rect class="b-per" x="790" y="30" width="320" height="136" rx="10"/>
<circle class="head" cx="816" cy="54" r="9"/>
<text class="t-name" x="834" y="58">Service operator</text>
<text class="t-type" x="834" y="76">[Person]</text>
<text class="t-desc" x="806" y="100">Runs the box, sets MCL_REALM, the</text>
<text class="t-desc" x="806" y="116">realm key and the station seeds, and</text>
<text class="t-desc" x="806" y="132">has the realm grant this node a D25</text>
<text class="t-desc" x="806" y="148">provider authorization per procedure</text>
<rect class="b-sys" x="420" y="230" width="320" height="152" rx="10"/>
<text class="t-name" x="436" y="258">mcl-tube</text>
<text class="t-type" x="436" y="276">[mcl_om mesh service]</text>
<text class="t-desc" x="436" y="300">Serves its own sealed procedures under</text>
<text class="t-desc" x="436" y="316">mcl-tube/ and the owner web UI on</text>
<text class="t-desc" x="436" y="332">8491 by default. Owns a reckon-db</text>
<text class="t-desc" x="436" y="348">store and an event-sourced catalog,</text>
<text class="t-desc" x="436" y="364">and announces it on four facts.</text>
<rect class="b-mac" x="40" y="460" width="300" height="120" rx="10"/>
<text class="t-name" x="56" y="488">macula-realm</text>
<text class="t-type" x="56" y="506">[Macula infrastructure]</text>
<text class="t-desc" x="56" y="530">Endorses the node's identity key and</text>
<text class="t-desc" x="56" y="546">issues the D25 provider grant for</text>
<text class="t-desc" x="56" y="562">each org-namespaced procedure</text>
<rect class="b-mac" x="420" y="460" width="320" height="152" rx="10"/>
<text class="t-name" x="436" y="488">Macula stations, mesh DHT</text>
<text class="t-type" x="436" y="506">[Macula infrastructure]</text>
<text class="t-desc" x="436" y="530">The pinned seeds in</text>
<text class="t-desc" x="436" y="546">MACULA_STATION_SEEDS carry every</text>
<text class="t-desc" x="436" y="562">call and fact (QUIC); the DHT holds</text>
<text class="t-desc" x="436" y="578">an advertisement per procedure:</text>
<text class="t-desc" x="436" y="594">its four, and mcl_om's info and get_limits</text>
<rect class="b-ext" x="790" y="460" width="320" height="136" rx="10"/>
<text class="t-name" x="806" y="488">A catalogue, the portal's</text>
<text class="t-type" x="806" y="506">[External system]</text>
<text class="t-desc" x="806" y="530">Subscribes to the four catalog facts</text>
<text class="t-desc" x="806" y="546">and lists channels and clips without</text>
<text class="t-desc" x="806" y="562">asking; a listing nobody re-announced</text>
<text class="t-desc" x="806" y="578">is expired.</text>
<path class="edge" d="M190 150V300H420" marker-end="url(#a)"/>
<text class="t-rel" x="198" y="172">uploads and publishes</text>
<text class="t-rel" x="198" y="188">through the UI on 8491 by default</text>
<path class="edge" d="M580 150V230" marker-end="url(#a)"/>
<text class="t-rel" x="588" y="186">seals a call to</text>
<text class="t-rel" x="588" y="202">mcl-tube/&lt;name&gt;</text>
<path class="edge" d="M950 166V200H700V230" marker-end="url(#a)"/>
<text class="t-rel" x="938" y="194" text-anchor="end">deploys; sets the realm and station variables</text>
<path class="edge" d="M460 382V420H190V460" marker-end="url(#a)"/>
<text class="t-rel" x="316" y="412" text-anchor="middle">boot claim, scope mcl-tube</text>
<path class="edge" d="M580 382V460" marker-end="url(#a)"/>
<text class="t-rel" x="588" y="404">advertises a record per</text>
<text class="t-rel" x="588" y="420">procedure, its own and mcl_om's,</text>
<text class="t-rel" x="588" y="436">and publishes the four facts</text>
<path class="edge" d="M740 320H860V460" marker-end="url(#a)"/>
<text class="t-rel" x="748" y="314">publishes the four catalog facts</text>
<text class="t-desc" x="40" y="632">The service calls nothing outside the mesh: a stream reads a clip off its own disk and the two lookups</text>
<text class="t-desc" x="40" y="650">read its own read model. Four procedures of its own refuse a caller that does not seal, so a station relays ciphertext.</text>
<rect class="b-sys" x="24" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="728">In scope</text>
<rect class="b-per" x="110.8" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="728">Person</text>
<rect class="b-mac" x="184.39999999999998" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="728">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="728">External system</text>
<rect class="b-cmp" x="490.0" y="716" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="728">Container or component</text>
</svg>
